<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input All</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>


    <div class="main">
  
        <div class="Text">
            <div class="firstText">
                <div class="cover">
                    <h4>Write Your Name:</h1>
                    <input type="text" placeholder="Ex: Rahim Khan">
                </div>
            </div>

            <div class="secondTextProject">
                <div class="coverSecond">
                    <div class="forCover">
                        <h6>username</h6>
                        <input type="text" placeholder="Enter username...">
                    </div>
                </div>
            </div>
        </div>




        <div class="password"></div>

        <div class="email">
            <div class="firstEmailProject">
                <div class="field">
                    <h5>Email</h5>
                    <input type="email" placeholder="personal@gmail.com">
                </div>
            </div>
        </div>
        <div class="checkbox">
            <input type="checkbox" id="che">
            <label for="che">
                I am the first</label>
        </div>
        <div class="number"></div>
        <div class="tel"></div>
        <div class="url"></div>
        <div class="search"></div>
        <div class="date"></div>
        <div class="time"></div>
        <div class="datetime-local"></div>
        <div class="month"></div>
        <div class="week"></div>
        <div class="range"></div>
        <div class="color"></div>
        <div class="radio"></div>
        <div class="file"></div>
        <div class="hidden"></div>
        <div class="submit"></div>
        <div class="reset"></div>
        <div class="button"></div>
        <div class="image"></div>
    
    </div>
</body>
</html>
